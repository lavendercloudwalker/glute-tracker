<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glute Growth Tracker</title>
<meta name="description" content="16-week glute growth and calisthenics training tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12052B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Glutes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Righteous&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ================= SYNTHWAVE SUNSET ================= */
:root{
  --night:#12052B;--night2:#1C0838;--card:rgba(24,8,50,.82);--card-solid:#1A0833;
  --ink:#FFEAF7;--muted:#B69BD0;--dim:#7E64A0;
  --pink:#FF6EC7;--hot:#FF3CAC;--orange:#FF9A5A;--yellow:#FFE259;--cyan:#2DE2E6;--mint:#3DFFB0;--red:#FF5470;--violet:#9D6BFF;
  --glow-pink:0 0 6px rgba(255,110,199,.9),0 0 18px rgba(255,60,172,.6);
  --glow-cyan:0 0 6px rgba(45,226,230,.9),0 0 16px rgba(45,226,230,.5);
  --sunset:linear-gradient(90deg,#FF3CAC 0%,#FF9A5A 60%,#FFE259 100%);
  --neon:"Monoton","Righteous",Impact,sans-serif;
  --retro:"Righteous","Trebuchet MS",sans-serif;
  --sans:"Outfit","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  /* names the app's code refers to */
  --accent:var(--pink);--rose:var(--pink);--sage:var(--cyan);--ochre:var(--yellow);--lav:var(--violet);--wash-rose:rgba(255,110,199,.25);--wash-lav:rgba(157,107,255,.25);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;background:var(--night)}
body{margin:0;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
 background:radial-gradient(1.2px 1.2px at 12% 18%,#fff8 50%,transparent 51%),radial-gradient(1px 1px at 68% 9%,#fff7 50%,transparent 51%),radial-gradient(1.4px 1.4px at 88% 34%,#fff6 50%,transparent 51%),radial-gradient(1px 1px at 34% 52%,#fff5 50%,transparent 51%),radial-gradient(1.2px 1.2px at 76% 71%,#fff5 50%,transparent 51%),radial-gradient(1px 1px at 20% 84%,#fff4 50%,transparent 51%),
 radial-gradient(120% 50% at 50% 100%,rgba(255,60,172,.28),transparent 60%),linear-gradient(180deg,#12052B 0%,#1B0736 55%,#2A0845 100%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 156px}
.muted{color:var(--muted)}.small{font-size:14px}

/* ---------- Header scene ---------- */
header.top{position:relative;margin:0 -14px;padding:18px 16px 0;overflow:hidden;
 background:linear-gradient(180deg,#12052B 0%,#260842 50%,#5A1266 100%);border-bottom:2px solid var(--pink);box-shadow:0 6px 24px -6px rgba(255,60,172,.55)}
.sky{position:relative;padding-bottom:16px}
.sky>*:not(.sunwrap){position:relative;z-index:1}
.sunwrap{position:absolute;right:-34px;bottom:0;width:176px;height:118px;overflow:hidden;pointer-events:none;z-index:0}
.ground{position:relative;margin:0 -16px;padding:16px 16px 14px;background:#150630;overflow:hidden}
.ground>*:not(.floor):not(.horizon){position:relative;z-index:1}
.sun{width:176px;height:176px;border-radius:50%;background:linear-gradient(180deg,#FFE259 0%,#FF9A5A 45%,#FF3CAC 100%);box-shadow:0 0 50px rgba(255,90,170,.55);
 -webkit-mask:linear-gradient(180deg,#000 0 42%,transparent 42% 46%,#000 46% 53%,transparent 53% 58%,#000 58% 63%,transparent 63% 69%,#000 69%);mask:linear-gradient(180deg,#000 0 42%,transparent 42% 46%,#000 46% 53%,transparent 53% 58%,#000 58% 63%,transparent 63% 69%,#000 69%)}
.horizon{position:absolute;left:0;right:0;top:0;z-index:2;height:2px;background:var(--pink);box-shadow:var(--glow-pink);pointer-events:none}
.floor{position:absolute;left:-60%;right:-60%;top:2px;height:260px;pointer-events:none;transform-origin:top;transform:perspective(200px) rotateX(64deg);opacity:.6;
 background:linear-gradient(transparent 0 94%,var(--cyan) 94%) 0 0/100% 26px,linear-gradient(90deg,transparent 0 96%,var(--cyan) 96%) 50% 0/34px 100%;
 -webkit-mask:linear-gradient(#000,transparent 85%);mask:linear-gradient(#000,transparent 85%)}
.shead{position:relative;z-index:1}
.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.eyebrow{margin:0;font-family:var(--retro);font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--cyan);text-shadow:var(--glow-cyan)}
.weeknum{margin:4px 0 0;font-family:var(--neon);font-weight:400;font-size:clamp(46px,14vw,60px);line-height:1;letter-spacing:1px;color:var(--pink);text-shadow:0 0 4px #ffd1ee,0 0 12px var(--pink),0 0 28px var(--hot),0 0 48px var(--hot);white-space:nowrap}
.weeknum small{display:block;margin-top:6px;font-family:var(--retro);font-size:15px;letter-spacing:7px;text-transform:uppercase;color:var(--orange);text-shadow:0 0 10px rgba(255,154,90,.8)}
.navbtns{display:flex;gap:8px;position:relative;z-index:2}
.iconbtn{width:44px;height:44px;border-radius:50%;border:2px solid var(--pink);background:rgba(18,5,43,.7);color:var(--pink);display:grid;place-items:center;font-family:var(--retro);font-size:22px;line-height:1;box-shadow:var(--glow-pink);text-shadow:0 0 8px var(--pink)}
.iconbtn:disabled{opacity:.25;box-shadow:none}
.phaseline{margin-top:10px}
.phase{font-family:var(--retro);font-size:19px;color:var(--cyan);text-shadow:var(--glow-cyan)}
.phase em{display:block;font-style:normal;font-family:var(--sans);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);text-shadow:none;margin-top:1px}
.todaybtn{margin-top:6px;border:1.5px solid var(--yellow);background:rgba(18,5,43,.6);color:var(--yellow);border-radius:999px;padding:4px 12px;font-family:var(--retro);font-size:13px;letter-spacing:1px;box-shadow:0 0 10px rgba(255,226,89,.4)}
.tracker{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;margin:4px 0 12px;position:relative}
.tracker button{height:22px;border:0;padding:0;border-radius:6px;background:rgba(45,226,230,.13);color:transparent;font-size:0;position:relative}
.tracker button.past{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.tracker button.today{outline:1.5px solid var(--yellow);outline-offset:1px}
.tracker button.dl{background:repeating-linear-gradient(45deg,rgba(157,107,255,.55) 0 3px,transparent 3px 6px)}
.tracker button.dl.past{background:var(--violet);box-shadow:0 0 8px var(--violet)}
.tracker button.cur{background:var(--sunset);box-shadow:0 0 10px var(--orange),0 0 20px rgba(255,60,172,.6);transform:scaleY(1.25)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;position:relative}
.days button{border:1px solid rgba(255,110,199,.35);background:rgba(18,5,43,.72);border-radius:14px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;min-height:64px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.days .dl{font-family:var(--retro);font-size:20px;line-height:1.05}
.days .dn{font-size:12px;color:var(--muted)}
.days .dot{height:12px;font-size:10px;line-height:12px}
.days .full .dot::before{content:"◆";color:var(--cyan);text-shadow:var(--glow-cyan)}
.days .part .dot::before{content:"◇";color:var(--pink)}
.days .train .dl{color:var(--pink);text-shadow:0 0 8px rgba(255,110,199,.8)}
.days button:not(.train) .dl{color:var(--muted)}
.days button.sel{background:var(--sunset);border-color:transparent;box-shadow:0 0 18px rgba(255,110,199,.7)}
.days button.sel .dl,.days button.sel .dn,.days button.sel .dot::before{color:#1A0733;text-shadow:none}
.days button.istoday{border:2px solid var(--yellow)}

/* ---------- Content ---------- */
.daytitle{font-family:var(--retro);font-size:36px;line-height:1.05;margin:24px 0 4px;color:#fff;text-shadow:0 0 10px var(--pink),0 0 26px rgba(255,60,172,.7)}
.daysub{color:var(--muted);margin:0 0 4px}
.daysub:first-of-type{font-family:var(--retro);font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--orange);text-shadow:0 0 8px rgba(255,154,90,.6)}
.phasenote{margin:14px 0;padding:11px 14px;border:1px solid rgba(45,226,230,.5);border-left:4px solid var(--cyan);border-radius:12px;background:rgba(45,226,230,.07);color:#DDFBFF;font-size:15px;box-shadow:0 0 14px rgba(45,226,230,.15)}
h2{font-family:var(--retro);font-weight:400;font-size:23px;margin:0 0 8px;line-height:1.15;color:#fff;text-shadow:0 0 8px rgba(45,226,230,.7)}
h3{font-size:15px;margin:14px 0 6px;font-weight:600;color:var(--cyan)}
.card,.ex{position:relative;background:var(--card);border-radius:20px;padding:16px;margin:16px 0;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.card{border:1.5px solid rgba(45,226,230,.55);box-shadow:0 0 16px rgba(45,226,230,.18),inset 0 0 18px rgba(45,226,230,.06)}
.ex{border:1.5px solid var(--pink);box-shadow:0 0 18px rgba(255,60,172,.35),inset 0 0 20px rgba(255,60,172,.08)}
.ex h2,.ex .exname{text-shadow:0 0 10px rgba(255,110,199,.9)}
details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary h2{margin:0}
details>summary .chev{display:inline-block;transition:transform .2s;color:var(--pink);font-family:var(--retro);font-size:20px}
details[open]>summary .chev{transform:rotate(90deg)}
details[open]>summary{margin-bottom:10px}
.count{font-family:var(--retro);font-size:15px;color:var(--muted)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid rgba(157,107,255,.2)}
.check:first-of-type{border-top:0}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;margin:0;border:2px solid var(--pink);border-radius:6px;background:transparent;position:relative}
.check input:checked{background:var(--cyan);border-color:var(--cyan);box-shadow:var(--glow-cyan)}
.check input:checked::after{content:"";position:absolute;left:6px;top:1px;width:7px;height:13px;border:solid #12052B;border-width:0 3px 3px 0;transform:rotate(45deg)}
.check label{flex:1}
.check input:checked+label{color:var(--dim);text-decoration:line-through}

/* Check-in */
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lights button{border:2px solid rgba(182,155,208,.35);background:rgba(18,5,43,.6);border-radius:14px;padding:10px 4px;font-family:var(--retro);font-size:18px;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--muted)}
.lights button svg{width:20px;height:20px}
.lights .g.on{border-color:var(--mint);color:var(--mint);box-shadow:0 0 14px rgba(61,255,176,.55),inset 0 0 12px rgba(61,255,176,.2);text-shadow:0 0 8px var(--mint)}
.lights .a.on{border-color:var(--orange);color:var(--orange);box-shadow:0 0 14px rgba(255,154,90,.55),inset 0 0 12px rgba(255,154,90,.2);text-shadow:0 0 8px var(--orange)}
.lights .r.on{border-color:var(--red);color:var(--red);box-shadow:0 0 14px rgba(255,84,112,.55),inset 0 0 12px rgba(255,84,112,.2);text-shadow:0 0 8px var(--red)}
.banner{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;border:1px solid}
.banner.a{background:rgba(255,154,90,.1);border-color:rgba(255,154,90,.6)}
.banner.r{background:rgba(255,84,112,.1);border-color:rgba(255,84,112,.6)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;align-items:end}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld label{display:block;font-size:13px;letter-spacing:.5px;color:var(--muted);margin-bottom:3px}
.fld input,.fld select,.level select,textarea.note{width:100%;border:1.5px solid rgba(45,226,230,.4);background:rgba(10,3,26,.75);border-radius:12px;padding:10px;font-size:16px;min-height:46px}
textarea.note{min-height:70px;resize:vertical;margin-top:8px}
.fld input:focus,.fld select:focus,textarea.note:focus,.setrow input:focus{outline:none;border-color:var(--pink);box-shadow:0 0 12px rgba(255,110,199,.6)}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1.5px solid rgba(255,110,199,.45);background:rgba(18,5,43,.6);border-radius:12px;min-height:44px;font-weight:600}
.seg button.on{background:var(--sunset);color:#1A0733;border-color:transparent;box-shadow:0 0 14px rgba(255,110,199,.6)}

/* Exercises */
.ex.skip{opacity:.5}
.exhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.exname{font-family:var(--retro);font-weight:400;font-size:26px;line-height:1.1;margin:0;color:#fff}
.rx{font-weight:600;font-size:16px;margin-top:6px}
.rx b{color:var(--orange);text-shadow:0 0 8px rgba(255,154,90,.8);font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid rgba(182,155,208,.5)}
.tag.amber{border-color:var(--orange);color:var(--orange)}
.tag.opt{border-color:var(--cyan);color:var(--cyan)}
.exdone{flex:none;font-family:var(--retro);font-size:18px;color:var(--muted)}
.exdone.ok{color:var(--cyan);text-shadow:var(--glow-cyan)}
.cue{font-size:14.5px;margin:8px 0 0;color:var(--muted)}
.variants{display:flex;gap:6px;overflow-x:auto;margin:12px -16px 0;padding:2px 16px 4px;scrollbar-width:none}
.variants::-webkit-scrollbar{display:none}
.variants button{flex:none;border:1.5px solid rgba(255,110,199,.45);background:rgba(18,5,43,.6);border-radius:999px;padding:5px 13px;font-size:14px;min-height:36px}
.variants button.on{background:var(--sunset);color:#1A0733;border-color:transparent;font-weight:700;box-shadow:0 0 12px rgba(255,110,199,.6)}
.last{margin-top:12px;border:1px solid rgba(45,226,230,.5);background:rgba(45,226,230,.07);border-radius:14px;padding:10px 12px;font-size:14.5px;color:#D5FAFF}
.last b{color:var(--cyan);font-weight:700}
.hint{margin-top:3px;color:#fff}
.uselast{border:0;background:none;color:var(--yellow);font-weight:700;padding:5px 0 0;font-size:14.5px;text-shadow:0 0 8px rgba(255,226,89,.5)}
.sets{margin-top:10px}
.setrow{display:grid;grid-template-columns:30px 1fr 1fr 50px;gap:8px;align-items:center;margin-top:9px}
.setrow.one{grid-template-columns:30px 1fr 50px}
.setrow .sn{font-family:var(--retro);font-size:22px;text-align:center;color:var(--cyan);text-shadow:var(--glow-cyan)}
.setrow.optrow .sn{color:var(--yellow);text-shadow:0 0 8px rgba(255,226,89,.7)}
.setrow input{width:100%;border:1.5px solid rgba(45,226,230,.4);background:rgba(10,3,26,.8);border-radius:12px;padding:8px 4px;font-size:22px;font-weight:700;text-align:center;min-height:50px;color:#fff}
.setrow input::placeholder{color:var(--dim);font-weight:500}
.unit{display:block;text-align:center;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.tick{width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,110,199,.55);background:rgba(18,5,43,.6);display:grid;place-items:center;font-size:21px;color:transparent;margin-bottom:17px}
.tick.on{background:var(--cyan);border-color:var(--cyan);color:#12052B;font-weight:800;box-shadow:0 0 14px var(--cyan),0 0 28px rgba(45,226,230,.5);animation:zap .3s ease}
@keyframes zap{0%{transform:scale(.8);filter:brightness(2)}100%{transform:scale(1);filter:none}}
.optlabel{font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--yellow);margin:12px 0 -2px 38px}
.exfoot{display:grid;grid-template-columns:100px 1fr;gap:8px;margin-top:12px}
.level{margin-top:12px}
.lvlnote{font-size:13.5px;color:var(--muted);margin-top:4px}
.more{border:0;background:none;color:var(--pink);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.big{width:100%;min-height:56px;border-radius:999px;border:0;background:var(--sunset);color:#1A0733;font-family:var(--retro);font-size:19px;letter-spacing:2px;text-transform:uppercase;margin-top:10px;box-shadow:0 0 22px rgba(255,90,170,.6)}
.big.done{background:rgba(18,5,43,.7);color:var(--cyan);border:2px solid var(--cyan);box-shadow:var(--glow-cyan),inset 0 0 14px rgba(45,226,230,.25);text-shadow:var(--glow-cyan)}
.ghost{border:2px solid var(--red);color:var(--red);background:transparent;border-radius:999px;min-height:44px;padding:0 16px;font-weight:700}

/* Photos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ph{position:relative;aspect-ratio:3/4;border-radius:14px;border:2px dashed rgba(45,226,230,.55);background:rgba(10,3,26,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font-size:14px;color:var(--muted);text-align:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ph .lab{position:absolute;left:6px;bottom:6px;background:rgba(18,5,43,.85);color:var(--cyan);border:1px solid var(--cyan);border-radius:6px;padding:0 6px;font-family:var(--retro);font-size:12px}
.ph .plus{font-family:var(--retro);font-size:30px;line-height:1;color:var(--pink);text-shadow:var(--glow-pink)}

/* Progress */
.tbl{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px 7px 0;border-bottom:1px solid rgba(157,107,255,.22);white-space:nowrap;vertical-align:top}
th{font-family:var(--retro);font-weight:400;font-size:13px;letter-spacing:1px;color:var(--cyan)}
.spark{width:100%;height:70px;display:block;margin-top:6px;filter:drop-shadow(0 0 4px var(--pink))}
.lift{padding:10px 0;border-top:1px solid rgba(157,107,255,.22)}
.lift:first-of-type{border-top:0}
.lift .row{display:flex;justify-content:space-between;gap:8px}
.lift .row b{font-family:var(--retro);font-weight:400;color:#fff}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.compare figure{margin:0}
.compare img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1.5px solid var(--cyan);box-shadow:0 0 12px rgba(45,226,230,.3)}
.compare figcaption{font-size:13px;color:var(--muted);margin-top:3px}
.empty{border:1.5px dashed rgba(157,107,255,.5);border-radius:12px;padding:14px;color:var(--muted);font-size:14px;aspect-ratio:3/4;display:grid;place-items:center;text-align:center}
.guide p,.guide li{font-size:15px}
.guide ul{padding-left:20px;margin:6px 0}
.guide li{margin:5px 0}
.guide li::marker{color:var(--pink)}
.guide b{color:#fff}
.status{font-size:13px;color:var(--muted)}

/* Timer + nav */
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;padding:0 12px;z-index:5}
.timer.show{display:flex}
.timer .in{max-width:536px;width:100%;background:linear-gradient(90deg,#3A0B5C,#1A0733);border:2px solid var(--pink);color:#fff;border-radius:999px;padding:7px 7px 7px 18px;display:flex;align-items:center;gap:8px;box-shadow:0 0 22px rgba(255,60,172,.55)}
.timer .t{font-family:var(--retro);font-size:30px;min-width:76px;color:var(--pink);text-shadow:var(--glow-pink);font-variant-numeric:tabular-nums}
.timer .tl{flex:1;font-size:13px;line-height:1.2;color:var(--muted)}
.timer button{border:1.5px solid rgba(255,255,255,.3);border-radius:999px;min-height:42px;padding:0 12px;background:transparent;color:inherit;font-weight:700}
.timer.over .in{border-color:var(--cyan);box-shadow:0 0 22px rgba(45,226,230,.6)}
.timer.over .t{color:var(--cyan);text-shadow:var(--glow-cyan)}

/* ================= PROGRESSION RULES ================= */
function phase(w){return w<=4?'Foundation':w<=8?'Build':w===9?'Deload':w<=13?'Growth':w<=15?'Consolidate':'Assessment'}
const PHASENOTE={
 Foundation:"Learn positions and build consistency. Add reps before load. No extra sets in the first 4 weeks.",
 Build:"When every set reaches the top of the rep range, add the smallest sensible load. Extra sets only on Green days.",
 Deload:"Planned reset. Fewer sets, same technique, 3–4 reps in reserve. No PR chasing; easy skill practice only.",
 Growth:"Your highest-quality growth block. Keep double progression going and add only one set at a time.",
 Consolidate:"Hold volume steady and aim for clean rep or load PRs.",
 Assessment:"Lower volume, clean reps. Re-test your skills and take final measurements."
};
function rirFor(ex,w,light){
 const p=phase(w);
 if(ex.kind==='core')return 'Controlled';
 if(ex.kind==='skill')return p==='Deload'?'Easy only':ex.rir;
 if(p==='Deload')return '3–4';
 if(light==='amber')return '~3';
 if(p==='Assessment')return '2–3';
 if(ex.kind==='comp'){if(p==='Foundation')return w<=2?'2–3':'1–2';return '1–2'}
 if(ex.kind==='iso'){if(p==='Foundation')return '1–2';if(p==='Growth')return '0–1 on last set';if(ex.id==='abC')return '0–1';return '0–2'}
 return ex.rir;
}
function setsFor(ex,w,light){
 const p=phase(w);let s=ex.sets,opt=0,skip=false,amberCut=false;
 if(ex.skipF&&p==='Foundation')skip=true;
 if(p!=='Foundation'&&ex.optAfterF)opt=1;
 if(ex.id==='gd'){if(p==='Build')opt=1;if(['Growth','Consolidate','Assessment'].includes(p)){s=3;opt=0}}
 if(ex.id==='ht'&&w>=11&&(p==='Growth'||p==='Consolidate'))opt=1;
 if(ex.id==='bss'&&w>=12&&(p==='Growth'||p==='Consolidate'))opt=1;
 if(p==='Deload'){s=Math.max(1,Math.round(s*0.6));opt=0;if(ex.id==='kb')skip=true}
 if(p==='Assessment'){if(s>=3)s-=1;opt=0}
 if(ex.kind==='skill'){s=1;opt=0}
 if(light==='amber'){opt=0;if(!ex.main){amberCut=true;if(s>1)s-=1}}
 return {s,opt,skip,amberCut};
}
function rng(r){const m=String(r).match(/(\d+)\D+(\d+)/);return m?[+m[1],+m[2]]:[0,0]}

/* ================= STORAGE (on this phone) ================= */
const LS='ggtracker-v1';
let store={settings:{startDate:'2026-09-28'},days:{},photos:{}};
try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c&&c.days){store=Object.assign(store,c);store.photos={}}}catch(e){}
let saveWarned=false;
function cacheLocal(){try{const {photos,...rest}=store;localStorage.setItem(LS,JSON.stringify(rest))}catch(e){if(!saveWarned){saveWarned=true;toast('Could not save. Phone storage may be full.')}}}
function dayId(w,d){return 'w'+w+'-'+d}
function getDay(w,d){return store.days[dayId(w,d)]||{}}
function mutDay(w,d,fn){const id=dayId(w,d);const o=store.days[id]||(store.days[id]={w,d});fn(o);o.updated=Date.now();markDirty(id)}
let saveT=null;function markDirty(){clearTimeout(saveT);saveT=setTimeout(cacheLocal,300)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){clearTimeout(saveT);cacheLocal()}});
window.addEventListener('pagehide',()=>{clearTimeout(saveT);cacheLocal()});
function storageLabel(){return persisted?'Saved on this phone. Protected from automatic clearing. Export a backup every few weeks.':'Saved on this phone. Export a backup every few weeks in case the phone clears website data.'}
let persisted=false;
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().then(p=>{persisted=p}).catch(()=>{})}

/* Photos live in IndexedDB as image files; photoURLs holds display links */
const photoURLs={};
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('ggtracker-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('photos');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(key,blob){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').put(blob,key);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function idbAll(){const d=await idb();return new Promise((res,rej)=>{const out={};const t=d.transaction('photos','readonly');const c=t.objectStore('photos').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){out[cur.key]=cur.value;cur.continue()}else res(out)};c.onerror=()=>rej(c.error)})}
async function idbClear(){const d=await idb();return new Promise(res=>{const t=d.transaction('photos','readwrite');t.objectStore('photos').clear();t.oncomplete=res})}
async function loadPhotos(){try{const all=await idbAll();for(const k in all){if(photoURLs[k])URL.revokeObjectURL(photoURLs[k]);photoURLs[k]=URL.createObjectURL(all[k])}render()}catch(e){}}

/* ================= DATES ================= */
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dateOf(w,di){const d=parseDate(store.settings.startDate);d.setDate(d.getDate()+(w-1)*7+di);return d}
function fmtDate(d){return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}
function fmtShort(d){return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'})}
function todayPos(){
 const s=parseDate(store.settings.startDate);const t=new Date();t.setHours(0,0,0,0);
 const diff=Math.floor((t-s)/864e5);
 if(diff<0)return{w:1,d:0,out:'before'};if(diff>=112)return{w:16,d:6,out:'after'};
 return{w:Math.floor(diff/7)+1,d:diff%7};
}

/* ================= HELPERS ================= */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function num(v){const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2200)}
function setPath(o,path,val){const k=path.split('.');let c=o;for(let i=0;i<k.length-1;i++){if(typeof c[k[i]]!=='object'||c[k[i]]===null)c[k[i]]={};c=c[k[i]]}c[k[k.length-1]]=val}
function getPath(o,path){return path.split('.').reduce((c,k)=>c==null?undefined:c[k],o)}
function orderIdx(w,d){return (w-1)*7+DAYS.indexOf(d)}
function entrySets(e){if(!e||!e.sets)return[];return Object.keys(e.sets).sort((a,b)=>a-b).map(k=>e.sets[k]).filter(Boolean)}
function loggedSets(e){return entrySets(e).filter(s=>s&&(s.done||num(s.reps)!=null||num(s.v)!=null||num(s.sec)!=null||num(s.min)!=null))}
function findPrev(exId,w,d){
 const cur=orderIdx(w,d);let best=null;
 for(const id in store.days){const o=store.days[id];if(!o.ex||!o.ex[exId])continue;
  const i=orderIdx(o.w,o.d);if(i>=cur)continue;
  if(loggedSets(o.ex[exId]).length&&(!best||i>best.i))best={i,w:o.w,d:o.d,e:o.ex[exId]}}
 return best;
}
function currentLevel(ladder,w,d,exId){
 const cur=getDay(w,d);const own=cur.ex&&cur.ex[exId]&&cur.ex[exId].level;if(own)return +own;
 const ci=orderIdx(w,d);let best=null;
 for(const id in store.days){const o=store.days[id];if(!o.ex)continue;const i=orderIdx(o.w,o.d);if(i>ci)continue;
  for(const k in o.ex){const ex=findEx(o.d,k);if(ex&&ex.ladder===ladder&&o.ex[k].level&&(!best||i>best.i))best={i,l:+o.ex[k].level}}}
 return best?best.l:(ladder==='pull'?2:1);
}
function findEx(d,id){const p=PLAN[d];return p&&p.ex?p.ex.find(e=>e.id===id):null}
function dayProgress(w,d){
 const p=PLAN[d],o=getDay(w,d);if(p.type!=='lift')return{done:!!o.complete||num(getPath(o,'daily.walk'))!=null||!!getPath(o,'daily.yoga'),total:0};
 let t=0,dn=0;const light=getPath(o,'checkin.light');
 p.ex.forEach(ex=>{const r=setsFor(ex,w,light);if(r.skip)return;t+=r.s;dn+=Math.min(r.s,loggedSets(o.ex&&o.ex[ex.id]).length)});
 return{done:dn,total:t,complete:!!o.complete};
}

/* ================= RENDER: HEADER ================= */
const PHASEWEEKS={Foundation:'weeks 1 to 4',Build:'weeks 5 to 8',Deload:'week 9',Growth:'weeks 10 to 13',Consolidate:'weeks 14 and 15',Assessment:'week 16'};
function renderHeader(){
 const {w,d}=view,tp=todayPos();
 let track='';for(let i=1;i<=16;i++){const cls=[i<tp.w&&i!==w?'past':'',i===w?'cur':'',i===tp.w&&i!==w?'today':'',i===9?'dl':''].join(' ');
  track+=`<button class="${cls}" data-a="week" data-v="${i}" aria-label="Week ${i}, ${phase(i)}">${i}</button>`}
 let days='';DAYS.forEach((dd,i)=>{
  const dt=dateOf(w,i),pr=dayProgress(w,dd),o=getDay(w,dd);
  const state=PLAN[dd].type==='lift'?(o.complete?'full':(pr.done>0?'part':'')):(pr.done?'full':'');
  const cls=[TRAIN.includes(dd)?'train':'',state,i===d?'sel':'',(w===tp.w&&i===tp.d&&!tp.out)?'istoday':''].join(' ');
  days+=`<button class="${cls}" data-a="day" data-v="${i}" aria-label="${DAYNAMES[i]}"><span class="dl">${DAYNAMES[i][0]}</span><span class="dn">${dt.getDate()}</span><span class="dot"></span></button>`});
 const showToday=view.tab==='day'&&!(w===tp.w&&d===tp.d);
 const hdr=document.getElementById('hdr');
 if(view.tab==='food'){hdr.innerHTML=foodHeader();return}
 if(view.tab==='day'){const p=phase(w);
  hdr.innerHTML=`<div class="sky"><div class="sunwrap"><div class="sun"></div></div><div class="toprow"><div><p class="eyebrow">Glute growth</p><h1 class="weeknum">Week ${w}<small>of 16</small></h1></div>
   <div class="navbtns"><button class="iconbtn" data-a="week" data-v="${w-1}" ${w<=1?'disabled':''} aria-label="Previous week">‹</button><button class="iconbtn" data-a="week" data-v="${w+1}" ${w>=16?'disabled':''} aria-label="Next week">›</button></div></div>
   <div class="phaseline"><span class="phase">${p} phase<em>${PHASEWEEKS[p]}</em></span></div>
   ${showToday?'<button class="todaybtn" data-a="today">Back to today</button>':''}</div>

function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function isoToday(){return isoOf(new Date())}
function dateFromIso(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=dateFromIso(s);d.setDate(d.getDate()+n);return isoOf(d)}
function r1(n){return Math.round(n*10)/10}
function entryMacros(e){if(e.quick)return{kcal:+e.kcal||0,p:+e.p||0,c:+e.c||0,f:+e.f||0,fib:+e.fib||0};const k=(+e.g||0)/100,m=e.per100;return{kcal:m.kcal*k,p:m.p*k,c:m.c*k,f:m.f*k,fib:(m.fib||0)*k}}

function dayTotals(iso){const t={kcal:0,p:0,c:0,f:0,fib:0};(foodDay(iso).entries||[]).forEach(e=>{const m=entryMacros(e);for(const k in t)t[k]+=m[k]});return t}

 store.recent.unshift(JSON.parse(JSON.stringify(food)));store.recent=store.recent.slice(0,30)}

function offToFood(p){const n=p.nutriments||{};let kcal=n['energy-kcal_100g'];if(kcal==null&&n['energy_100g']!=null)kcal=n['energy_100g']/4.184;
 if(kcal==null&&n.proteins_100g==null)return null;
 const sq=parseFloat(p.serving_quantity);
 return{id:'off'+p.code,src:'off',code:p.code,name:(p.product_name||p.product_name_en||p.product_name_nl||'Unnamed product').trim(),brand:(p.brands||'').split(',')[0].trim(),
  per100:{kcal:+kcal||0,p:+n.proteins_100g||0,c:+n.carbohydrates_100g||0,f:+n.fat_100g||0,fib:+n.fiber_100g||0},servingG:sq>0?sq:null,servingLabel:p.serving_size||''}}
async function offSearch(q){const u='https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=24&sort_by=unique_scans_n&fields=code,product_name,product_name_en,product_name_nl,brands,nutriments,serving_size,serving_quantity';
 const r=await fetch(u);if(!r.ok)throw new Error('http');const j=await r.json();return (j.products||[]).map(offToFood).filter(Boolean)}
async function offProduct(code){const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=code,product_name,product_name_en,product_name_nl,brands,nutriments,serving_size,serving_quantity');
 if(!r.ok)throw new Error('http');const j=await r.json();if(j.status!==1||!j.product)return null;return offToFood(Object.assign({code},j.product))}

/* Barcode scanning */
let scanner=null;
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[src="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function startScan(silentRestart){
 const msg=t=>{sheet.scanMsg=t;const m=document.getElementById('scanmsg');if(m)m.textContent=t};
 try{
  if(!silentRestart){sheet.scanning=true;renderSheet();return}
  if(scanner)return;
  msg('Starting camera…');
  await loadScript('https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js');
  const F=window.Html5QrcodeSupportedFormats;
  scanner=new Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false,experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(280,w*.85),height:Math.min(150,h*.5)})},code=>{onBarcode(code)},()=>{});
  msg('Point the camera at the barcode on the packet.');
 }catch(e){scanner=null;sheet.scanning=false;msg(navigator.onLine?'Could not start the camera. Check camera permission for this app, or type the barcode below.':'The scanner needs signal the first time. Type the barcode below, or try again with signal.');const b=document.getElementById('scanbtn');if(b)b.textContent='Start camera'}
}
function stopScan(){const s=scanner;scanner=null;if(sheet)sheet.scanning=false;if(s){try{s.stop().then(()=>s.clear()).catch(()=>{})}catch(e){}}}
async function onBarcode(code){if(sheet.busy)return;sheet.busy=true;stopScan();await lookupCode(code);sheet.busy=false}
async function lookupCode(code){
 code=String(code||'').replace(/\D/g,'');if(!code){toast('Type a barcode number first');return}
 const mine=[...store.myFoods,...store.recent].find(f=>f.code===code);if(mine){selectFood(mine);return}
 sheet.scanMsg='Looking up '+code+'…';renderSheet();
 try{const f=await offProduct(code);if(f){selectFood(f)}else{sheet.scanMsg='Not found in the database. Create it under My foods, or use Quick add.';sheet.scanning=false;renderSheet()}}
 catch(e){sheet.scanMsg='Lookup needs signal. Try again, or use Quick add.';sheet.scanning=false;renderSheet()}
}

/* Food tab */
function bar(label,val,unit,min,max,cls){
 if(!min&&!max)return `<div class="mbar"><div class="mtop"><span>${label}</span><span><b>${Math.round(val)}</b> ${unit}</span></div></div>`;
 const top=max||min,scale=top*1.25,fill=Math.min(100,val/scale*100);
 const band=max&&min?`<i class="band" style="left:${min/scale*100}%;width:${(max-min)/scale*100}%"></i>`:`<i class="mark" style="left:${min/scale*100}%"></i>`;
 const tgt=max&&min?`${min}–${max}`:`${min}`;
 return `<div class="mbar ${cls||''}"><div class="mtop"><span>${label}</span><span><b>${Math.round(val)}</b> / ${tgt} ${unit}</span></div><div class="track2">${band}<i class="fill" style="width:${fill}%"></i></div></div>`}

 if(pmin&&t.p<pmin&&hasFood(iso))h+=`<p class="small" style="margin:8px 0 0"><b>${Math.ceil(pmin-t.p)} g</b> protein to go to reach ${pmin} g.</p>`;

 h+=`</div>`;

// [fraction of working weight, reps, optional]
const WU={ht:[[.3,'8–10'],[.55,'5'],[.75,'3'],[.875,'1–2',1]],sq:[[.5,'6'],[.75,'3']],bss:[[.5,'5 per leg'],[.75,'3 per leg']],gd:[[.5,'6'],[.7,'4'],[.85,'2']]};
function suggestedKg(ex,w,prev){
 if(!prev)return null;const ls=loggedSets(prev.e);const kgs=ls.map(s=>num(s.kg)).filter(v=>v!=null);if(!kgs.length)return null;
 const kg=Math.max(...kgs);if(phase(w)==='Deload')return kg;const [,hi]=rng(ex.reps);
 const need=Math.max(1,setsFor(ex,prev.w,getPath(getDay(prev.w,prev.d),'checkin.light')).s);
 const allTop=ls.length>=need&&ls.slice(0,need).every(s=>(num(s.reps)||0)>=hi);
 return allTop?Math.round((kg+(kg<20?1:2.5))*100)/100:kg;
}
function roundLoad(x,work){const step=work>=20?2.5:1;return Math.round(x/step)*step}
function renderWarmup(ex,w,dk,e){
 const plan=WU[ex.id];if(!plan)return '';
 const typed=num(getPath(e,'sets.0.kg'));const sug=suggestedKg(ex,w,findPrev(ex.id,w,dk));const work=typed!=null&&typed>0?typed:sug;
 const done=e.wu||{};
 let inner;
 if(!(work>0)){inner=`<p class="small muted" style="margin:4px 0 0">Enter your working weight in set 1 and your ramp-up sets appear here.</p>`}
 else{const seen=new Set();const chips=[];const light=ex.id==='bss'&&work<12;const pl=light?[[0,'6 per leg'],[.5,'3 per leg']]:plan;
  pl.forEach(([fr,reps,opt],i)=>{let kg=roundLoad(work*fr,work);if(kg>=work)return;const key=kg>0?kg:0;if(seen.has(key))return;seen.add(key);
   chips.push(`<button class="wuchip ${done[i]?'on':''}" data-a="wutick" data-ex="${ex.id}" data-i="${i}"><b>${kg>0?kg+' kg':(ex.id==='bss'?'Bodyweight':'Very light')}</b> × ${reps}${opt?'<small>optional</small>':''}</button>`)});
  inner=`<div class="wus">${chips.join('<span class="wuarrow">›</span>')}</div><p class="small muted" style="margin:6px 0 0">Based on ${typed!=null&&typed>0?'your':'today\'s suggested'} <b>${work} kg</b>${typed!=null&&typed>0?'':'. Change set 1 and these update'}. Easy reps, not logged.</p>`}
 return `<div class="wu" data-wu="${ex.id}"><div class="wuh">Ramp-up sets</div>${inner}</div>`;
}

function prName(ex,variant){if(ex.assist&&variant!=='Lat pulldown')return 'Pull-up (assisted)';return ex.name+(variant?' ('+variant+')':'')}
function prCompute(){
 const flags={},events=[],best={},ladderMax={};
 const days=Object.values(store.days).filter(o=>o&&o.ex&&PLAN[o.d]&&PLAN[o.d].ex).sort((a,b)=>orderIdx(a.w,a.d)-orderIdx(b.w,b.d));
 days.forEach(o=>{PLAN[o.d].ex.forEach(ex=>{const e=o.ex[ex.id];if(!e||!e.sets)return;
  const variant=e.variant||(ex.variants?ex.variants[0]:'');const lv=ex.ladder?+(e.level||currentLevel(ex.ladder,o.w,o.d,ex.id)):null;
  const sets=Object.keys(e.sets).sort((a,b)=>a-b).map(i=>[i,e.sets[i]]).filter(([,s])=>s&&(s.done||num(s.reps)!=null||num(s.sec)!=null));
  if(!sets.length)return;
  let levelUp=null;
  if(ex.ladder&&!(ex.assist&&variant==='Lat pulldown')){const m=ladderMax[ex.ladder];if(m!=null&&lv>m)levelUp={t:'level',title:LADDERS[ex.ladder].name+' level up',txt:'Level '+lv+': '+LADDERS[ex.ladder].levels[lv-1][0],prev:'Level '+m};ladderMax[ex.ladder]=Math.max(m||0,lv)}
  sets.forEach(([i,s],n)=>{const types=[];if(n===0&&levelUp)types.push(levelUp);
   const kg=num(s.kg),reps=num(s.reps);
   if(ex.unit==='kg'&&ex.assist&&variant!=='Lat pulldown'){ // assisted pull-ups: less assistance is the win
    if(kg!=null&&reps){const key='assist';const b=best[key]||(best[key]={name:'Pull-up (assisted)',kind:'assist',minKg:null,repsAt:{},count:0});const [lo]=rng(ex.reps);
     if(b.count){if(reps>=lo&&kg<b.minKg)types.push({t:'assist',title:'Pull-up (assisted)',txt:kg+' kg assistance × '+reps,prev:'least before '+b.minKg+' kg'});
      else if(b.repsAt[kg]!=null&&reps>b.repsAt[kg])types.push({t:'reps',title:'Pull-up (assisted)',txt:kg+' kg assistance × '+reps,prev:'best at '+kg+' kg: '+b.repsAt[kg]+' reps'})}
     if(reps>=lo)b.minKg=b.minKg==null?kg:Math.min(b.minKg,kg);b.repsAt[kg]=Math.max(b.repsAt[kg]||0,reps);b.count++;b.top={kg,reps,w:o.w,d:o.d}}
   }else if(ex.unit==='kg'){
    if(reps){const bw=kg==null;const key=prName(ex,variant)+(bw?'|bw':'');const b=best[key]||(best[key]={name:prName(ex,variant)+(bw?', bodyweight':''),kind:bw?'bw':'kg',maxKg:null,maxReps:0,repsAt:{},count:0,top:null});
     if(bw){if(b.count&&reps>b.maxReps)types.push({t:'reps',title:b.name,txt:reps+' reps',prev:'best '+b.maxReps});b.maxReps=Math.max(b.maxReps,reps);if(!b.top||reps>=b.top.reps)b.top={reps,w:o.w,d:o.d}}
     else{if(b.count){if(kg>b.maxKg)types.push({t:'load',title:b.name,txt:kg+' kg × '+reps,prev:'heaviest before '+b.maxKg+' kg'});
       else if(b.repsAt[kg]!=null&&reps>b.repsAt[kg])types.push({t:'reps',title:b.name,txt:kg+' kg × '+reps,prev:'best at '+kg+' kg: '+b.repsAt[kg]+' reps'})}
      b.maxKg=b.maxKg==null?kg:Math.max(b.maxKg,kg);b.repsAt[kg]=Math.max(b.repsAt[kg]||0,reps);
      if(!b.top||kg>b.top.kg||(kg===b.top.kg&&reps>b.top.reps))b.top={kg,reps,w:o.w,d:o.d}}
     b.count++}
   }else if(ex.unit==='bw'){
    if(reps){const name=ex.ladder?LADDERS[ex.ladder].name+' L'+lv+' ('+LADDERS[ex.ladder].levels[lv-1][0]+')':ex.name;const b=best[name]||(best[name]={name,kind:'bw',maxReps:0,count:0,top:null});
     if(b.count&&reps>b.maxReps)types.push({t:'reps',title:name,txt:reps+' reps',prev:'best '+b.maxReps});b.maxReps=Math.max(b.maxReps,reps);b.count++;if(!b.top||reps>=b.top.reps)b.top={reps,w:o.w,d:o.d}}
   }else if(ex.unit==='sec'||ex.unit==='skill'){
    const sec=num(s.sec);if(sec){const name=ex.unit==='skill'?'Handstand L'+lv+' hold':ex.name;const b=best[name]||(best[name]={name,kind:'sec',maxSec:0,count:0,top:null});
     if(b.count&&sec>b.maxSec)types.push({t:'time',title:name,txt:sec+' s',prev:'best '+b.maxSec+' s'});b.maxSec=Math.max(b.maxSec,sec);b.count++;if(!b.top||sec>=b.top.sec)b.top={sec,w:o.w,d:o.d}}
   }
   if(types.length){flags[o.w+'-'+o.d+'-'+ex.id+'-'+i]=types;types.forEach(t=>events.push(Object.assign({w:o.w,d:o.d},t)))}
  })})});

// Ideas to close a protein (or calorie) gap, from foods you actually eat first, then common foods.
function foodPool(){const map=new Map();const since=addDays(isoToday(),-21);const key=f=>(f.name+'|'+(f.brand||'')).toLowerCase();
 const add=(f,score)=>{if(!f||!f.per100)return;const k=key(f);const cur=map.get(k);if(cur)cur.uses+=score;else map.set(k,{food:f,uses:score,own:score>0})};
 Object.keys(store.food).forEach(iso=>{if(iso<since)return;(store.food[iso].entries||[]).forEach(e=>{if(e.quick||!e.per100)return;add({id:'log'+key(e),name:e.name,brand:e.brand,per100:e.per100,servingG:e.servingG,servingLabel:e.servingLabel,unitOnly:e.unitOnly,src:e.src,code:e.code},2)})});
 store.myFoods.forEach(f=>add(f,1));store.recent.forEach(f=>add(f,1));BUILTIN.forEach(f=>add(f,0));
 return [...map.values()]}
function roundAmt(g){return g<60?Math.max(5,Math.round(g/5)*5):Math.round(g/10)*10}
function portionFor(f,need,per){ // per: 'p' or 'kcal'; returns grams (or servings*100 for serving-only foods) and what it covers
 const unit=f.per100[per];if(!(unit>0))return null;
 if(f.unitOnly){let s=Math.ceil(need/unit*2)/2;s=Math.min(Math.max(s,.5),2);return{g:s*100,servings:s,covers:s*unit}}
 if(f.servingG){let s=Math.ceil(need/(unit*f.servingG/100)*2)/2;s=Math.min(Math.max(s,.5),2);const g=s*f.servingG;if(g*f.per100.kcal/100<=500)return{g,servings:s,covers:g*unit/100}}
 let g=roundAmt(need/unit*100);const maxG=Math.min(400,Math.round(450/Math.max(f.per100.kcal,1)*100));g=Math.max(20,Math.min(g,maxG));return{g,covers:g*unit/100}}
function gapIdeas(iso){
 const t=dayTotals(iso),T=store.settings.targets,pmin=num(T.pmin),kt=num(T.kcal);
 if(!hasFood(iso))return null;
 if(pmin&&t.p<pmin-2){const need=pmin-t.p;
  const c=foodPool().filter(x=>x.food.per100.p>=5&&x.food.per100.p/Math.max(x.food.per100.kcal,1)*100>=7&&x.food.per100.p/Math.max(x.food.per100.kcal,1)*100<60)
   .map(x=>{const d=x.food.per100.p/x.food.per100.kcal*100;return Object.assign(x,{score:d+(x.own?6+x.uses:0)})}).sort((a,b)=>b.score-a.score);
  const own=c.filter(x=>x.own).slice(0,3),rest=c.filter(x=>!x.own);const pick=[...own,...rest].slice(0,4);
  return{kind:'p',need,items:pick.map(x=>({food:x.food,own:x.own,por:portionFor(x.food,Math.min(need,40),'p')})).filter(x=>x.por)}}
 if(kt&&pmin&&t.p>=pmin&&t.kcal<kt-250){const need=kt-t.kcal;
  const c=foodPool().filter(x=>x.food.per100.kcal>=150&&(x.food.per100.p>=3||x.food.per100.c>=10)).map(x=>Object.assign(x,{score:(x.own?300+x.uses*20:0)+x.food.per100.kcal/4+x.food.per100.p*2})).sort((a,b)=>b.score-a.score);
  const pick=c.slice(0,4);return{kind:'kcal',need,items:pick.map(x=>({food:x.food,own:x.own,por:portionFor(x.food,Math.min(need,350),'kcal')})).filter(x=>x.por)}}
 return null}
let gapList=[];

function isoToWD(iso){const s=parseDate(store.settings.startDate),d=dateFromIso(iso);const diff=Math.round((d-s)/864e5);if(diff<0||diff>=112)return null;return{w:Math.floor(diff/7)+1,dk:DAYS[diff%7]}}

function liftStalls(){const out=[];const tIso=isoToday();

  for(let w=1;w<=16;w++){const o=getDay(w,dk),e=o.ex&&o.ex[id];if(!e)continue;const v=e.variant||(ex.variants?ex.variants[0]:'');

   const e1=Math.max(...ls.map(s=>num(s.kg)*(1+num(s.reps)/30)));const key=prName(ex,v);(sess[key]=sess[key]||[]).push({w,e1,iso:isoOf(dateOf(w,DAYS.indexOf(dk)))})}
  Object.entries(sess).forEach(([key,list])=>{if(list.length<4)return;const last=list.slice(-3),before=list.slice(0,-3);
   const bestBefore=Math.max(...before.map(x=>x.e1)),bestLast=Math.max(...last.map(x=>x.e1));

   else I.push({tone:'watch',title:`Glutes unchanged after ${lastCp.wk} weeks`,tip:'Check the basics in order: are your main lifts going up, are you eating enough, are you sleeping, and are you measuring the same way each time? This is a good moment to bring your logs to Claude for a proper look.'})}}

/* ================= CONSISTENCY ================= */
function isActiveDay(o){return !!o.complete||(num(getPath(o,'daily.walk'))||0)>0||!!getPath(o,'daily.yoga')||(num(getPath(o,'daily.meals'))||0)>0}
function consistency(){
 const tp=todayPos();const tIdx=tp.out==='before'?-1:tp.out==='after'?999:orderIdx(tp.w,DAYS[tp.d]);
 const cells={};let planned=0,kept=0,sessions=0,active=0;const weekKept={};
 for(let w=1;w<=16;w++){let wk=0,wkPlanned=0;
  DAYS.forEach((dk,di)=>{const idx=orderIdx(w,dk),o=getDay(w,dk),train=TRAIN.includes(dk),future=idx>tIdx,isToday=idx===tIdx;
   const red=getPath(o,'checkin.light')==='red';let st;
   if(train){
    if(o.complete)st='done';else if(red)st='rest';else if(dayProgress(w,dk).done>0)st='part';else if(future)st='future';else if(isToday)st='todo';else st='miss';
    if(o.complete)sessions++;
    const counts=!future&&!(isToday&&st==='todo');
    if(counts){planned++;wkPlanned++;if(st==='done'||st==='rest'){kept++;wk++}}
   }else{st=isActiveDay(o)?'move':future?'future':'off'}
   if(!future&&isActiveDay(o))active++;
   cells[w+'-'+di]={st,isToday}});
  weekKept[w]={kept:wk,planned:wkPlanned,full:wk===4};
 }
 // streak of weeks with all 4 sessions kept (a Red rest day counts as kept)
 let streak=0,best=0,run=0;const lastW=Math.min(tp.w,16);
 for(let w=1;w<=lastW;w++){const finished=w<tp.w||tp.out==='after';
  if(weekKept[w].full){run++;best=Math.max(best,run)}else if(finished){run=0}}
 if(tp.out!=='before'){
  streak=0;let w=lastW;if(!weekKept[w].full&&!(tp.out==='after'))w--;
  while(w>=1&&weekKept[w].full){streak++;w--}}
 return {cells,planned,kept,sessions,active,streak,best,tp,weekKept};
}

function audioCtx(){
 if(!snd.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;
  try{if(navigator.audioSession)navigator.audioSession.type='ambient'}catch(e){} // mix with music instead of pausing it

 return snd.ctx}
function tone(ctx,t,freq,dur,vol,type){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);

 o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+dur+0.05);snd.nodes.push(o)}
function volLevel(){return {low:.10,med:.22,high:.4}[store.settings.sound.vol]||.22}
function chime(ctx,t){const v=volLevel();[[523.25,0],[659.25,.11],[783.99,.22],[1046.5,.33]].forEach(([f,dt])=>tone(ctx,t+dt,f,.34,v,'triangle'));tone(ctx,t+.33,2093,.6,v*.3,'sine')}

 if(s.count)[3,2,1].forEach(k=>{if(left-k>0.1)blip(ctx,t0+left-k)});chime(ctx,t0+left)}
function unlockAudio(){const ctx=audioCtx();if(ctx){tone(ctx,ctx.currentTime,440,.02,.0002,'sine');snd.nodes.pop()}}

}
async function startCam(){
 stopCamStream();const msg=t=>{const m=document.getElementById('gcmsg');if(m)m.textContent=t};
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg('The camera is not available here. Use "choose from your library" below.');return}
 try{cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing,width:{ideal:1920},height:{ideal:1920}},audio:false});
  const v=document.getElementById('gcvideo');if(v){v.srcObject=cam.stream;await v.play().catch(()=>{})}}
 catch(e){msg('Could not open the camera. Check camera permission for this app, or choose a photo from your library below.')}
}
function stopCamStream(){if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}}
function openGhostCam(w,dk,angle){cam.target={w,dk,angle};cam.shot=null;cam.counting=false;const refs=ghostRefs(w,dk,angle);if(!refs.last)cam.ref='base';
 renderCam();camEl().classList.add('show');document.body.style.overflow='hidden';startCam()}
function closeGhostCam(){stopCamStream();cam.counting=false;if(cam.shot)URL.revokeObjectURL(cam.shot.url);cam.shot=null;const el=document.getElementById('ghostcam');if(el){el.classList.remove('show');el.innerHTML=''}document.body.style.overflow=''}
function captureFrame(){
 const v=document.getElementById('gcvideo');if(!v||!v.videoWidth){toast('Camera is not ready yet');return}
 const vw=v.videoWidth,vh=v.videoHeight,ar=3/4;let sx=0,sy=0,sw=vw,sh=vh;
 if(vw/vh>ar){sw=vh*ar;sx=(vw-sw)/2}else{sh=vw/ar;sy=(vh-sh)/2}
 const scale=Math.min(1,1600/sh);const c=document.createElement('canvas');c.width=Math.round(sw*scale);c.height=Math.round(sh*scale);
 c.getContext('2d').drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);
 c.toBlob(b=>{if(!b){toast('Could not take the photo');return}cam.shot={blob:b,url:URL.createObjectURL(b)};stopCamStream();renderCam()},'image/jpeg',.9);
}
async function shoot(){if(cam.counting)return;
 if(!cam.timer){flashShot();captureFrame();return}
 cam.counting=true;const el=()=>document.getElementById('gccount');let n=cam.timer;
 const beep=()=>{const s=store.settings.sound;if(s&&s.on){const ctx=audioCtx();if(ctx)blip(ctx,ctx.currentTime+.01)}};
 unlockAudio();
 while(n>0&&cam.counting){if(el())el().textContent=n;beep();await new Promise(r=>setTimeout(r,1000));n--}
 if(el())el().textContent='';if(!cam.counting)return;cam.counting=false;flashShot();captureFrame();
}
function flashShot(){const f=document.querySelector('.gcframe');if(f){f.classList.remove('flash');void f.offsetWidth;f.classList.add('flash')}}
document.addEventListener('input',ev=>{const t=ev.target;if(t.dataset&&t.dataset.gc==='ghost'){cam.ghost=(+t.value)/100;const g=document.querySelector('.gcghost');if(g)g.style.opacity=cam.ghost}});
async function handleCamAction(a,b){
 if(a==='ghostcam'){openGhostCam(view.w,DAYS[view.d],b.dataset.k)}
 else if(a==='gcclose'){closeGhostCam()}
 else if(a==='gcflip'){cam.facing=cam.facing==='user'?'environment':'user';renderCam();startCam()}
 else if(a==='gctimer'){cam.timer=cam.timer===0?3:cam.timer===3?10:0;renderCam();if(cam.stream){const v=document.getElementById('gcvideo');if(v){v.srcObject=cam.stream;v.play().catch(()=>{})}}}
 else if(a==='gctoggle'){cam.show=!cam.show;renderCam()}
 else if(a==='gcref'){cam.ref=b.dataset.v;renderCam()}
 else if(a==='gcshoot'){shoot()}
 else if(a==='gcretake'){if(cam.shot)URL.revokeObjectURL(cam.shot.url);cam.shot=null;renderCam();startCam()}
 else if(a==='gcuse'){const t=cam.target,blob=cam.shot.blob;closeGhostCam();await savePhoto(t.w,t.dk,t.angle,blob)}
 else return false;return true;
}

/* ================= PHOTOS ================= */
function compress(file,max,q){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{let {width:W,height:H}=img;const s=Math.min(1,max/Math.max(W,H));const c=document.createElement('canvas');c.width=Math.round(W*s);c.height=Math.round(H*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('compress')),'image/jpeg',q)};img.onerror=()=>rej(new Error('read'));img.src=u})}
async function savePhoto(w,dk,angle,file){
 toast('Saving photo…');
 try{
  const blob=await compress(file,1400,.82);const pid='w'+w+'-'+dk+'-'+angle;
  await idbPut(pid,blob);
  if(photoURLs[pid])URL.revokeObjectURL(photoURLs[pid]);photoURLs[pid]=URL.createObjectURL(blob);
  mutDay(w,dk,o=>setPath(o,'meas.photos.'+angle,{pid}));render();toast('Photo saved');
 }catch(e){toast('Photo could not be saved. Try again.')}
}

/* ================= EXPORT ================= */
async function saveFile(name,data,type){
 const blob=new Blob([data],{type});
 try{const f=new File([blob],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return 'shared'}}
 catch(e){if(e&&e.name==='AbortError')return 'cancelled'}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
 return 'downloaded';
}
function exportFoodCSV(){const rows=[['Date','Meal','Food','Brand','Grams','kcal','Protein g','Carbs g','Fat g','Fibre g']];
 Object.keys(store.food).sort().forEach(iso=>{(store.food[iso].entries||[]).forEach(e=>{const m=entryMacros(e);rows.push([iso,e.meal,e.name||'Quick add',e.brand||'',e.quick?'':e.unitOnly?r1(e.g/100)+' serving(s)':e.g,Math.round(m.kcal),r1(m.p),r1(m.c),r1(m.f),r1(m.fib)])})});
 saveFile('glute-tracker-food.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv')}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportCSV(){
 const tp=todayPos();const rows=[['Week','Phase','Date','Day','Exercise','Variant','Level','Target','Set','kg','Reps','Seconds','Metres','Minutes','Value','Done','Final RIR','Note']];
 for(let w=1;w<=16;w++)TRAIN.forEach(dk=>{const di=DAYS.indexOf(dk);if(orderIdx(w,dk)>orderIdx(tp.w,DAYS[tp.d]))return;const o=getDay(w,dk);const light=getPath(o,'checkin.light');
  PLAN[dk].ex.forEach(ex=>{const r=setsFor(ex,w,light);if(r.skip)return;const e=(o.ex||{})[ex.id]||{};const n=Math.max(r.s,Object.keys(e.sets||{}).length);
   for(let i=0;i<n;i++){const s=(e.sets||{})[i]||{};const f=k=>s[k]!==undefined&&s[k]!==''?s[k]:'NR';const dt=dateOf(w,di);
    rows.push([w,phase(w),dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'),DAYNAMES[di],ex.name,e.variant||(ex.variants?ex.variants[0]:''),e.level||'',r.s+' × '+ex.reps,i+1,f('kg'),f('reps'),f('sec'),f('m'),f('min'),f('v'),s.done?'Yes':'No',e.rir||'NR',e.note||''])}})});
 saveFile('glute-tracker-sets.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\n'),'text/csv');
}
function blobToData(b){return new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(b)})}
let pendingBackup=null;
async function exportBackup(){
 toast('Preparing backup…');
 let photos={};try{const all=await idbAll();for(const k in all)photos[k]=await blobToData(all[k])}catch(e){}
 const d=new Date(),stamp=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
 const data=JSON.stringify({version:3,exported:d.toISOString(),settings:store.settings,days:store.days,food:store.food,myFoods:store.myFoods,meals:store.meals,recent:store.recent,photos});
 pendingBackup={name:'glute-tracker-backup-'+stamp+'.json',data,photos:Object.keys(photos).length};
 const mb=(data.length/1048576);
 let el=document.getElementById('bkready');if(!el){el=document.createElement('div');el.id='bkready';el.className='bkready';document.body.appendChild(el)}
 el.innerHTML=`<div class="bkin"><h2>Backup ready</h2><p class="small" style="margin:0 0 4px">${pendingBackup.name}<br><span class="muted">${mb<0.1?'Under 0.1':mb.toFixed(1)} MB${pendingBackup.photos?', including '+pendingBackup.photos+' photo'+(pendingBackup.photos===1?'':'s'):''}</span></p>
  <p class="small muted" style="margin:0 0 12px">Tap Save, then choose <b>Save to Files</b> and pick iCloud Drive, so it survives even if you lose your phone.</p>
  <div class="seg"><button data-a="bksave" class="on">Save</button><button data-a="bkcancel">Cancel</button></div></div>`;
 el.classList.add('show');
}
async function saveBackupNow(){if(!pendingBackup)return;const r=await saveFile(pendingBackup.name,pendingBackup.data,'application/json');
 if(r!=='cancelled'){store.settings.lastBackup=Date.now();store.settings.backupSnooze=0;cacheLocal();pendingBackup=null;document.getElementById('bkready').classList.remove('show');render();toast('Backup saved')}}
/* ================= BACKUP REMINDER ================= */
function backupStatus(){
 const freq=store.settings.backupDays==null?14:+store.settings.backupDays;const last=store.settings.lastBackup||0;
 const changedDays=Object.values(store.days).filter(o=>(o.updated||0)>last).length;const foodChanged=(store.foodUpdated||0)>last;
 const stamps=Object.values(store.days).map(o=>o.updated||0).filter(Boolean);if(store.foodFirst)stamps.push(store.foodFirst);
 const first=stamps.length?Math.min(...stamps):0;
 const since=last||first;const days=since?Math.floor((Date.now()-since)/864e5):0;
 const due=freq>0&&(changedDays>0||foodChanged)&&since&&days>=freq&&Date.now()>(store.settings.backupSnooze||0);
 return {due,days,never:!last,changedDays,foodChanged,freq,last};
}
function backupBanner(){const s=backupStatus();if(!s.due)return '';
 const what=[s.changedDays?s.changedDays+' day'+(s.changedDays===1?'':'s')+' of training logs':'',s.foodChanged?'food logs':''].filter(Boolean).join(' and ');
 return `<div class="card bkcard"><h2>Time for a backup</h2><p class="small" style="margin:0 0 12px">${s.never?'You haven\'t backed up yet':'Your last backup was '+s.days+' days ago'}. ${esc(what.charAt(0).toUpperCase()+what.slice(1))} only live on this phone right now. It takes about 20 seconds.</p>
  <div class="seg"><button class="on" data-a="backup">Back up now</button><button data-a="bksnooze">In 3 days</button></div></div>`}
function restore(file){const r=new FileReader();r.onload=async()=>{try{const j=JSON.parse(r.result);if(!j.days)throw 0;
 if(!confirm('Restore this backup? Days in the backup will replace the same days on this phone.'))return;
 Object.assign(store.settings,j.settings||{});for(const id in j.days){store.days[id]=j.days[id]}
 if(j.food)Object.assign(store.food,j.food);if(j.myFoods)store.myFoods=j.myFoods;if(j.meals)store.meals=j.meals;if(j.recent)store.recent=j.recent;initFoodStore();
 for(const id in store.days){const o=store.days[id];const ph=o.meas&&o.meas.photos;if(ph)for(const a in ph){if(ph[a]&&!ph[a].pid)delete ph[a]}}
 if(j.photos)for(const k in j.photos){try{const b=await (await fetch(j.photos[k])).blob();await idbPut(k,b)}catch(e){}}
 cacheLocal();await loadPhotos();render();toast('Backup restored')}catch(e){toast('That file is not a tracker backup')}};r.readAsText(file)}

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}

document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const k=new Date().toDateString();if(k!==lastDayKey){lastDayKey=k;Object.assign(view,todayPos());view.fdate=isoToday();if(!sheet.open)render()}}});
loadPhotos();
render();
